name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-web:
    name: Build Web (PWA)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  build-android:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          fi
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk

  build-pages:
    name: Build Web for Pages
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  validate-ios:
    name: Validate iOS Build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          cd ios
          xcodebuild -project Game6561.xcodeproj -scheme Game6561 \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package Simulator App
        run: |
          APP_PATH=$(find ios/build -name "Game6561.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Game6561.app not found in build output"
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/Game6561-simulator.zip" "$(basename "$APP_PATH")"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: Game6561-simulator.zip
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-web, build-android, validate-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: release-artifacts-ios
      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat > release-notes.md << EOF
          ## 6561 v$VERSION

          ### Downloads
          - **Android APK** (debug): app-debug.apk
          - **Android APK** (release, if signed): app-release.apk
          - **iOS Simulator App**: Game6561-simulator.zip（解压后将 \`Game6561.app\` 拖入模拟器即可安装运行）

          ### Web
          - Play online at: https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)/

          ### iOS 真机安装说明
          - 模拟器包（无签名）仅用于 iOS Simulator，无法安装到真机
          - 真机安装需在 Xcode 中配置 Apple Developer 签名后 Archive 导出（详见 \`ios/README.md\`）
          - 手动构建：\`cd ios && xcodegen generate\` 后用 Xcode 打开 \`Game6561.xcodeproj\` 构建

          ### Changelog
          See commits since previous release.
          EOF
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 6561 v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: |
            release-artifacts/**/*
            release-artifacts-ios/**/*

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build-pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
