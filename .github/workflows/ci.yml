name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-web:
    name: Build Web (PWA)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  build-android:
    name: Build Android APK
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Build Release APK (if keystore configured)
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk

  validate-ios:
    name: Validate iOS Build
    needs: [test]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: List Xcode versions
        run: xcodebuild -version
      - name: Check Swift syntax
        run: |
          cd ios
          swift build 2>/dev/null || true
          # Validate syntax of all Swift files
          for f in $(find Game6561 -name "*.swift"); do
            swift -parse "$f" 2>&1 || echo "Warning: $f needs Xcode project context"
          done
      - name: Check project structure
        run: |
          echo "iOS source files:"
          find ios/Game6561 -name "*.swift" | sort
          echo "---"
          echo "Lines of Swift code:"
          find ios/Game6561 -name "*.swift" -exec wc -l {} +

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-web, build-android, validate-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts
      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cat > release-notes.md << EOF
          ## 6561 v$VERSION

          ### Downloads
          - **Android APK** (debug): app-debug.apk
          - **Android APK** (release, if signed): app-release.apk

          ### Web
          - Play online at: https://$(echo ${{ github.repository }} | cut -d/ -f1).github.io/$(echo ${{ github.repository }} | cut -d/ -f2)/

          ### iOS
          Open in Xcode and build from source: \`ios/Game6561/\`

          ### Changelog
          See commits since previous release.
          EOF
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 6561 v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: release-artifacts/**/*

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build-web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
