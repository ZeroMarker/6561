<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bloxorz 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
    <div id="ui">
        <div class="stats">
            <div>Level: <span id="level-val">1</span></div>
            <div>Moves: <span id="moves-val">0</span></div>
        </div>
        <div class="controls">
            <button id="reset-btn">Reset Level</button>
            <a href="../index.html" class="back-btn">Back to Home</a>
        </div>
    </div>
    <div id="game-container"></div>
    <div id="overlay" class="hidden">
        <h1 id="overlay-title">Level Complete!</h1>
        <button id="next-btn">Next Level</button>
    </div>

    <script src="levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
